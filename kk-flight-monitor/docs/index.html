<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KK flight price monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>KK flight price monitor</h1>
    <p id="meta" class="muted">Loading...</p>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer>
    <p class="muted">
      Prices are the cheapest nonstop fare Google Flights shows for each date, read once a day.
      The signal is a simple rule set, not a guarantee. Fares can change at any time.
      <a href="data/prices.csv">Download all recorded prices (CSV)</a>
    </p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
