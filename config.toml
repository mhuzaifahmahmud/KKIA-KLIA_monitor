# ---------------------------------------------------------------
#  KK flight price monitor - settings
#  EDIT THE [[range]] DATES AT THE BOTTOM to the dates you actually want.
# ---------------------------------------------------------------

[settings]
currency = "MYR"
country = "my"                  # Google Flights country (affects fares shown)
nonstop_only = true             # KK to KL/Penang is normally nonstop
monthly_search_limit = 240      # SerpApi free plan = 250 searches/month; keeps a safety margin
request_delay_seconds = 5       # pause between SerpApi searches (polite)
serpapi_daily_max = 6           # SerpApi is only the backup: at most this many searches per run (6 x 30 = 180 a month)
browser_delay_min = 15          # browser mode: random pause between pages, seconds
browser_delay_max = 40
timezone_offset_hours = 8       # Malaysia time, used for the daily date stamp
min_history_for_model = 14      # daily checks needed before the trend rule is used

[alerts]
drop_rm = 20                    # push alert if the cheapest fare falls by at least RM 20 since the last check...
drop_pct = 8                    # ...or by at least 8 percent
new_low = true                  # alert when a new lowest price is seen
book_signal = true              # alert when the signal becomes BOOK NOW / BOOK SOON
rise_rm = 40                    # alert on a jump of at least RM 40 (a cheap fare tier probably sold out); 0 = off
max_lines = 8                   # longest alert message (most important changes first)
daily_summary = false           # true = also send a short summary every day

# DATES TO WATCH
# A [[range]] watches every Nth day between two dates, in one direction. One page = one date.
# Browser mode (Mac) has no search limit, so a wide range is fine: 90 pages takes about 1 to 1.5 hours.
# SerpApi (GitHub) is only the backup and is capped by serpapi_daily_max above.
# Airport codes: BKI = Kota Kinabalu, KUL = Kuala Lumpur, PEN = Penang.
# Dates that have passed are skipped automatically.
# To also compare Penang, copy the two blocks and change KUL to PEN and the label.

[[range]]
label = "KK to KUL"
from = "BKI"
to = "KUL"
start = "2026-12-01"
end = "2027-02-28"
step_days = 2

[[range]]
label = "KUL to KK"
from = "KUL"
to = "BKI"
start = "2026-12-01"
end = "2027-02-28"
step_days = 2

# You can still add single dates with [[watch]] (label, from, to, date), for example:
# [[watch]]
# label = "KK to KUL"
# from = "BKI"
# to = "KUL"
# date = "2026-12-24"
